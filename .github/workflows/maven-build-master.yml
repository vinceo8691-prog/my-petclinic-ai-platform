# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI on main branch

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B verify
        # SonarCloud analysis was removed here: it was hardcoded to the upstream project's
        # organization/project key. Set up your own SonarCloud project and add a SONAR_TOKEN
        # secret, then re-add: org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        # -Dsonar.projectKey=<your-key> -Dsonar.organization=<your-org>
